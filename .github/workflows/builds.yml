name: Auto-Tag and Release Cross-Platform Packages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-tag:
    name: Generate Version Tag
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tagger.outputs.new_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Bump Tag and Create Release
        id: tagger
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor
          release_branches: main

  build-windows:
    name: Build Windows EXE
    needs: create-tag
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 Pillow nuitka

      - name: Build Standalone EXE with Nuitka
        run: |
          nuitka --mode=onefile --enable-plugin=pyside6 --windows-icon-from-ico=assets/square_logo.ico --windows-console-mode=disable --output-filename=png2ico-windows.exe src/png2ico.py

      - name: Upload Windows Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tag.outputs.new_tag }}
          files: png2ico-windows.exe

  build-linux:
    name: Build Linux AppImage
    needs: create-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Build Dependencies & AppImageTool
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1-mesa wget
          sudo wget https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip --break-system-packages
          pip install PySide6 Pillow nuitka --break-system-packages

      - name: Build AppImage with Nuitka
        run: |
          nuitka --mode=onefile --enable-plugin=pyside6 --linux-create-installer --linux-icon=assets/square_logo.png src/png2ico.py
          mv *.AppImage png2ico-linux.AppImage

      - name: Upload Linux Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tag.outputs.new_tag }}
          files: png2ico-linux.AppImage

  build-macos:
    name: Build macOS DMG
    needs: create-tag
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & create-dmg
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 Pillow nuitka
          brew install create-dmg

      - name: Build macOS App Bundle with Nuitka
        run: |
          nuitka --enable-plugin=pyside6 --macos-create-app-bundle --macos-app-icon=assets/square_logo.png --macos-app-name="png2ico" --output-dir=dist src/png2ico.py

      - name: Package App Bundle into .dmg
        run: |
          create-dmg \
            --volname "png2ico Installer" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --icon-size 100 \
            --icon "png2ico.app" 175 120 \
            --hide-extension "png2ico.app" \
            --app-drop-link 425 120 \
            "png2ico-macos.dmg" \
            "dist/png2ico.app"

      - name: Upload macOS Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tag.outputs.new_tag }}
          files: png2ico-macos.dmg
