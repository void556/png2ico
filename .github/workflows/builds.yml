name: Auto-Tag and Release Windows Package

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-tag:
    name: Generate Version Tag
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tagger.outputs.new_tag }}
      changelog: ${{ steps.tagger.outputs.changelog }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Bump Tag and Create Release
        id: tagger
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor
          release_branches: main

  build-windows:
    name: Build Windows EXE
    needs: create-tag
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 Pillow nuitka

      - name: Build Standalone EXE with Nuitka
        run: |
          nuitka --mode=onefile --enable-plugin=pyside6 --windows-icon-from-ico=assets/square_logo.ico --windows-console-mode=disable --output-filename=png2ico-windows.exe src/png2ico.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bin
          path: png2ico-windows.exe

  publish-release:
    name: Publish GitHub Release
    needs: [create-tag, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-bin

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.create-tag.outputs.new_tag }}
          name: Release ${{ needs.create-tag.outputs.new_tag }}
          body: ${{ needs.create-tag.outputs.changelog }}
          artifacts: "png2ico-windows.exe"
